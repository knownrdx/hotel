version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotelhotspot}
      POSTGRES_USER: ${POSTGRES_USER:-hoteluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotelpass123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hotel_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hoteluser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - hotel_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hoteluser}:${POSTGRES_PASSWORD:-hotelpass123}@postgres:5432/${POSTGRES_DB:-hotelhotspot}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-changeme_super_secret_key_here}
      CORS_ORIGINS: "*"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hotel.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    networks:
      - hotel_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # backend শুধু internal — কোনো port expose নেই
    # frontend nginx এর মাধ্যমে access হবে

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - hotel_net

volumes:
  postgres_data:

networks:
  hotel_net:
    driver: bridge
